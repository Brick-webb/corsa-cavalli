<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ippodromo 3D - Corse dei Cavalli</title>
    <link rel="stylesheet" href="style.css">
    <!-- Libreria Three.js per la grafica 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Canvas 3D a schermo intero -->
    <div id="canvas-container"></div>

    <!-- Interfaccia Sovrapposta (HUD) -->
    <div class="ui-overlay">
        <header class="top-bar">
            <div class="title-box">
                <h1>🏇 Ippodromo 3D</h1>
                <button id="camera-btn" class="cam-btn" title="Cambia inquadratura">🎥 Visuale: Inseguimento</button>
            </div>
            <div class="wallet">
                <span>Saldo: <strong id="balance">1000</strong> €</span>
                <button id="refill-btn" title="Ricarica crediti infiniti">+1000 € Gratis</button>
            </div>
        </header>

        <!-- Banner Stato / Risultati -->
        <div id="status-banner" class="status-banner">
            Piazza la tua scommessa e clicca su "Via alla Gara!"
        </div>

        <!-- Pannello Scommesse in basso -->
        <div class="betting-panel">
            <div class="controls">
                <div class="control-group">
                    <label for="horse-select">Cavallo:</label>
                    <select id="horse-select"></select>
                </div>

                <div class="control-group">
                    <label for="bet-amount">Puntata (€):</label>
                    <input type="number" id="bet-amount" value="100" min="10" step="10">
                </div>

                <div class="action-buttons">
                    <button id="start-btn" class="primary-btn">Via alla Gara!</button>
                    <button id="reset-btn" class="secondary-btn" disabled>Nuova Gara</button>
                </div>
            </div>

            <!-- Quote compatte -->
            <div class="horses-grid" id="horses-info"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
